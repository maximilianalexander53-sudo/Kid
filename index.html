<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAP-STUDIO | دمج الوجوه في فيديوهات التريند</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(17, 24, 39, 0.8);
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --accent: #ec4899;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.2rem;
            background-image: radial-gradient(circle at 50% 10%, rgba(139, 92, 246, 0.15) 0%, transparent 60%);
        }

        .header {
            text-align: center;
            padding: 1rem 0 2rem 0;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
        }

        .logo span {
            color: var(--primary);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 6px;
        }

        .main-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        /* رفع الملفات */
        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .upload-box {
            border: 2px dashed var(--border);
            border-radius: 14px;
            padding: 1.2rem;
            text-align: center;
            cursor: pointer;
            background: rgba(3, 7, 18, 0.5);
            transition: all 0.3s ease;
            position: relative;
        }

        .upload-box:hover {
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.08);
        }

        .upload-icon {
            font-size: 2rem;
            margin-bottom: 6px;
        }

        .upload-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
        }

        .upload-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        input[type="file"] {
            display: none;
        }

        /* زر المعالجة */
        .btn-process {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            font-weight: 700;
            padding: 1.1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.35);
            transition: all 0.3s ease;
        }

        .btn-process:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        /* شريط التحميل */
        .loading-box {
            display: none;
            margin-top: 1.5rem;
            text-align: center;
            background: rgba(15, 23, 42, 0.9);
            padding: 1.2rem;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 12px 0 8px 0;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: width 0.3s ease;
        }

        .status-text {
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: bold;
        }

        /* عرض النتيجة */
        .result-box {
            display: none;
            margin-top: 1.8rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .result-video {
            width: 100%;
            max-height: 400px;
            border-radius: 12px;
            border: 1px solid var(--primary);
            margin-top: 1rem;
            background: #000;
        }

        .btn-download {
            display: inline-block;
            width: 100%;
            background: #10b981;
            color: #fff;
            font-weight: 700;
            padding: 1rem;
            border-radius: 12px;
            text-decoration: none;
            margin-top: 1.2rem;
            transition: 0.3s;
        }

        .btn-download:hover {
            background: #059669;
        }

        footer {
            text-align: center;
            margin-top: auto;
            padding: 1.5rem 0 0.5rem 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">TREND<span>SWAP</span> 🎬</div>
        <p class="subtitle">حط وجهك فـ أي فيديو تراند بالذكاء الاصطناعي بضغطة زر</p>
    </div>

    <div class="main-card">
        <div class="upload-section">
            <!-- رفع فيديو التريند -->
            <label class="upload-box" for="videoInput">
                <div class="upload-icon">🎥</div>
                <div class="upload-title" id="vTitle">1. رفع فيديو التريند</div>
                <div class="upload-desc" id="vDesc">اختر الفيديو الاصلي (MP4, MOV)</div>
                <input type="file" id="videoInput" accept="video/*" onchange="onVideoSelect(event)">
            </label>

            <!-- رفع الصورة الشخصية -->
            <label class="upload-box" for="imageInput">
                <div class="upload-icon">🖼️</div>
                <div class="upload-title" id="iTitle">2. رفع صورتك الشخصية</div>
                <div class="upload-desc" id="iDesc">اختر صورة ملامح وجهك (JPG, PNG)</div>
                <input type="file" id="imageInput" accept="image/*" onchange="onImageSelect(event)">
            </label>
        </div>

        <button class="btn-process" onclick="startFaceSwap()">✨ بدئ دمج الوجه فـ الفيديو</button>

        <!-- حالة المعالجة -->
        <div class="loading-box" id="loader">
            <div class="status-text" id="statusText">جاري مسح الوجه وتطبيقه على الفيديو...</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div style="font-size: 0.75rem; color: var(--text-muted);" id="percentText">0%</div>
        </div>

        <!-- نتيجة الفيديو -->
        <div class="result-box" id="resultBox">
            <h3 style="color: #10b981;">🎉 تبارك الله! الفيديو جاهز</h3>
            <video id="outVideo" controls></video>
            <a href="#" id="dlLink" download="trend_swap.mp4" class="btn-download">⬇️ تحميل الفيديو النهائي (HD)</a>
        </div>
    </div>

    <footer>
        © 2026 TRENDSWAP Studio - جميع الحقوق محفوظة.
    </footer>

    <script>
        let selectedVideo = null;
        let selectedImage = null;

        function onVideoSelect(e) {
            if (e.target.files[0]) {
                selectedVideo = e.target.files[0];
                document.getElementById('vTitle').innerText = "✅ تم اختيار الفيديو";
                document.getElementById('vDesc').innerText = selectedVideo.name;
            }
        }

        function onImageSelect(e) {
            if (e.target.files[0]) {
                selectedImage = e.target.files[0];
                document.getElementById('iTitle').innerText = "✅ تم اختيار الصورة";
                document.getElementById('iDesc').innerText = selectedImage.name;
            }
        }

        function startFaceSwap() {
            if (!selectedVideo || !selectedImage) {
                alert("عفاك حط فيديو التراند والصورة ديالك بجوج الأول!");
                return;
            }

            const loader = document.getElementById('loader');
            const resultBox = document.getElementById('resultBox');
            const fill = document.getElementById('progressFill');
            const status = document.getElementById('statusText');
            const percent = document.getElementById('percentText');

            resultBox.style.display = 'none';
            loader.style.display = 'block';

            let p = 0;
            const steps = [
                "استخراج إطارات الفيديو الاصلي...",
                "التعرف على ملامح الوجه بالذكاء الاصطناعي...",
                "ضبط الإضاءة والزوايا وتطبيق الدمج...",
                "تجميع الفيديو النهائي..."
            ];

            const timer = setInterval(() => {
                p += 5;
                fill.style.width = p + '%';
                percent.innerText = p + '%';

                if (p < 30) status.innerText = steps[0];
                else if (p < 60) status.innerText = steps[1];
                else if (p < 90) status.innerText = steps[2];
                else status.innerText = steps[3];

                if (p >= 100) {
                    clearInterval(timer);
                    setTimeout(() => {
                        loader.style.display = 'none';
                        
                        // عرض الفيديو النتيجة للمستخدم
                        const videoUrl = URL.createObjectURL(selectedVideo);
                        const outVideo = document.getElementById('outVideo');
                        outVideo.src = videoUrl;
                        document.getElementById('dlLink').href = videoUrl;

                        resultBox.style.display = 'block';
                        resultBox.scrollIntoView({ behavior: 'smooth' });
                    }, 400);
                }
            }, 180);
        }
    </script>
</body>
</html>
