<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOAD-MEDIA | أداة تحميل الفيديوهات مجاناً</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070913;
            --card-bg: rgba(15, 23, 42, 0.75);
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.35);
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
        }

        header {
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(7, 9, 19, 0.85);
            backdrop-filter: blur(12px);
        }

        .logo { font-size: 1.4rem; font-weight: 900; color: var(--text-main); }
        .logo span { color: var(--primary); }

        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 2.5rem 1.2rem;
        }

        .hero { text-align: center; margin-bottom: 2.5rem; }
        .hero h1 { font-size: 2.1rem; font-weight: 900; margin-bottom: 0.8rem; }
        .hero p { color: var(--text-muted); font-size: 0.95rem; }

        .downloader-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 1rem;
        }

        .input-group input {
            flex: 1;
            padding: 1rem;
            background: rgba(3, 7, 18, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            direction: ltr;
            text-align: left;
            font-family: 'Fira Code', monospace;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-fetch {
            background: var(--primary);
            color: #000;
            font-weight: 700;
            padding: 1rem 1.8rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .btn-fetch:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--primary-glow);
        }

        /* Result Section */
        .result-card {
            display: none;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .media-info {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 1.5rem;
            background: rgba(3, 7, 18, 0.5);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .media-thumb {
            width: 110px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            background: #000;
        }

        .media-details h4 { font-size: 0.95rem; font-weight: 700; margin-bottom: 5px; }
        .media-details p { font-size: 0.8rem; color: var(--text-muted); }

        .formats-list {
            display: grid;
            gap: 10px;
        }

        .format-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .format-quality { font-weight: bold; font-size: 0.9rem; }

        .btn-dl {
            background: var(--accent-blue);
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-dl:hover { opacity: 0.9; transform: scale(1.03); }

        .loader {
            display: none;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--primary);
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: auto;
        }

        @media (max-width: 600px) {
            .input-group { flex-direction: column; }
            .btn-fetch { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">📥 LOAD<span>MEDIA</span></div>
    </header>

    <main>
        <section class="hero">
            <h1>تحميل الفيديوهات من أي موقع مجاناً</h1>
            <p>ضع رابط الفيديو من يوتيوب، تيك توك، فيسبوك أو إنستغرام وابدأ التنزيل مباشرة</p>
        </section>

        <section class="downloader-card">
            <label style="font-weight: 700; font-size: 0.9rem; color: var(--text-muted);">
                أدخل رابط الفيديو (Video URL):
            </label>
            <div class="input-group">
                <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
                <button class="btn-fetch" onclick="fetchVideo()">جلب الروابط 🔍</button>
            </div>

            <div class="loader" id="loader">⚡ جاري تحليل الفيديو واستخراج جودات التنزيل...</div>

            <!-- Download Formats Result -->
            <div class="result-card" id="resultCard">
                <div class="media-info">
                    <img id="videoThumb" class="media-thumb" src="" alt="Thumbnail">
                    <div class="media-details">
                        <h4 id="videoTitle">عنوان الفيديو ينزل هنا</h4>
                        <p id="videoSource">المصدر: Youtube</p>
                    </div>
                </div>

                <div class="formats-list" id="formatsList">
                    <!-- الخيارات ستولد تلقائياً -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        © 2026 LOAD-MEDIA - أداة تحميل الوسائط الرقمية.
    </footer>

    <script>

            }
