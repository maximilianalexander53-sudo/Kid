<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة توليد الفيديوهات بالذكاء الاصطناعي AI Video Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { font-size: 1.8rem; margin-bottom: 0.5rem; color: #fff; }
        p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; }
        
        .upload-box {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
            background: rgba(15, 23, 42, 0.4);
        }
        .upload-box:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }
        .upload-icon { font-size: 2.5rem; margin-bottom: 10px; }
        
        input[type="file"] { display: none; }
        
        .btn-generate {
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            padding: 0.9rem 2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.05rem;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--primary-glow);
        }
        .btn-generate:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        .loading {
            display: none;
            margin-top: 1.5rem;
            color: var(--primary);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مولد الفيديو بالذكاء الاصطناعي 🎬</h1>
        <p>ارفع صورتك أو الفيديو الخاص بك، ودع الذكاء الاصطناعي ينتج لك محتوى مذهلاً مطابقاً.</p>

        <label class="upload-box" for="mediaFile">
            <div class="upload-icon">📁</div>
            <div id="fileLabelText">اضغط هنا لرفع الصورة أو الفيديو (أو قم بالسحب والإفلات)</div>
            <input type="file" id="mediaFile" accept="image/*,video/*" onchange="handleFileSelect(event)">
        </label>

        <button class="btn-generate" onclick="startProcess()">بدء توليد الفيديو بالذكاء الاصطناعي</button>

        <div class="loading" id="loadingText">جاري معالجة الملف عبر خوادم الذكاء الاصطناعي، يرجى الانتظار...</div>
    </div>

    <script>
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('fileLabelText').innerText = `تم اختيار الملف: ${file.name}`;
            }
        }

        function startProcess() {
            const fileInput = document.getElementById('mediaFile');
            if (fileInput.files.length === 0) {
                alert("المرجو رفع ملف (صورة أو فيديو) أولاً!");
                return;
            }

            document.getElementById('loadingText').style.display = 'block';

            // هنا يتم إرسال الملف إلى الخلفية (Backend) أو الـ API لمعالجته
            setTimeout(() => {
                document.getElementById('loadingText').style.display = 'none';
                alert("تم محاكاة المعالجة بنجاح! لربطها بـ API حقيقي، قم بربط السيرفر بخدمات مثل Replicate أو Fal.ai.");
            }, 3000);
        }
    </script>
</body>
</html>
