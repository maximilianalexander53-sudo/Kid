<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAP-AI | دمج الوجوه الحقيقي بالذكاء الاصطناعي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(17, 24, 39, 0.85);
            --primary: #8b5cf6;
            --accent: #ec4899;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 1.5rem; display: flex; justify-content: center; align-items: center; }
        
        .main-card {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.8rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        h1 { text-align: center; margin-bottom: 1.5rem; font-size: 1.5rem; }
        
        .upload-group { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
        .upload-box {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 1.2rem;
            text-align: center;
            cursor: pointer;
            background: rgba(3, 7, 18, 0.5);
            transition: 0.3s;
        }
        .upload-box:hover { border-color: var(--primary); }
        input[type="file"] { display: none; }

        .btn-submit {
            width: 100%;
            padding: 1.1rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            color: #fff;
            font-weight: bold;
            font-size: 1.05rem;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.35);
        }

        .status-box {
            display: none;
            margin-top: 1.5rem;
            text-align: center;
            color: var(--primary);
            font-weight: bold;
        }

        .result-box {
            display: none;
            margin-top: 1.5rem;
            text-align: center;
        }
        video { width: 100%; border-radius: 12px; margin-top: 10px; border: 1px solid var(--primary); }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>تحويل الوجه في فيديو التريند (حقيقي) 🎬</h1>

        <form id="swapForm">
            <div class="upload-group">
                <label class="upload-box" for="videoFile">
                    <div id="vLabel">🎥 اختر فيديو التريند (MP4)</div>
                    <input type="file" id="videoFile" name="video" accept="video/*" required onchange="updateLabel('vLabel', this)">
                </label>

                <label class="upload-box" for="imageFile">
                    <div id="iLabel">🖼️ اختر صورتك الشخصية (JPG/PNG)</div>
                    <input type="file" id="imageFile" name="image" accept="image/*" required onchange="updateLabel('iLabel', this)">
                </label>
            </div>

            <button type="submit" class="btn-submit">✨ بدء التوليد والتبديل الفعلي</button>
        </form>

        <div class="status-box" id="statusBox">
            🔄 جاري معالجة الفيديو في السيرفر عبر الذكاء الاصطناعي... (قد يستغرق دقيقة)
        </div>

        <div class="result-box" id="resultBox">
            <h3 style="color: #10b981;">✅ تم تبديل الوجه بنجاح!</h3>
            <video id="resultVideo" controls></video>
        </div>
    </div>

    <script>
        function updateLabel(id, input) {
            if (input.files[0]) {
                document.getElementById(id).innerText = "✅ تم اختيار: " + input.files[0].name;
            }
        }

        document.getElementById('swapForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const videoInput = document.getElementById('videoFile');
            const imageInput = document.getElementById('imageFile');

            if (!videoInput.files[0] || !imageInput.files[0]) {
                alert("المرجو اختيار الفيديو والصورة معاً!");
                return;
            }

            const formData = new FormData();
            formData.append('video', videoInput.files[0]);
            formData.append('image', imageInput.files[0]);

            const statusBox = document.getElementById('statusBox');
            const resultBox = document.getElementById('resultBox');
            
            statusBox.style.display = 'block';
            resultBox.style.display = 'none';

            try {
                const response = await fetch('/api/face-swap', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                statusBox.style.display = 'none';

                if (data.success) {
                    const videoElem = document.getElementById('resultVideo');
                    videoElem.src = data.video_url;
                    resultBox.style.display = 'block';
                } else {
                    alert("حدث خطأ أثناء المعالجة: " + data.error);
                }
            } catch (err) {
                statusBox.style.display = 'none';
                alert("تعذر الاتصال بالسيرفر. تأكد من عمل السيرفر بشكل صحيح.");
            }
        });
    </script>
</body>
</html>
